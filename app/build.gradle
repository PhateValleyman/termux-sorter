plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.umbrellacorp.filesorter"
    compileSdk 34

    defaultConfig {
        applicationId "com.umbrellacorp.filesorter"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
	lint {
		abortOnError false
		checkReleaseBuilds false
	}

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Bez keystore.properties se podepíše debug klíčem, aby build
            // nespadl (viz README pro nastavení opravdového release klíče).
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
