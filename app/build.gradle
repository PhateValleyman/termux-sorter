plugins {
    id 'com.android.application'
}
android {
    namespace "com.umbrellacorp.termuxsorter"
    compileSdk 34
    defaultConfig {
        applicationId "com.umbrellacorp.termuxsorter"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
